# Auto-deploys the site to Firebase Hosting on every push to main.
#
# Requires the repo secret FIREBASE_SERVICE_ACCOUNT (a Firebase service-account
# JSON key with deploy access). Set it up with `firebase init hosting:github`,
# which creates the service account and uploads the secret for you.
#
# Firebase project ID is serc-website-d2ac4 (the display name "serc-website" is
# NOT the ID). Node must be >= 22.12 for Astro to build.

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: serc-website-d2ac4
